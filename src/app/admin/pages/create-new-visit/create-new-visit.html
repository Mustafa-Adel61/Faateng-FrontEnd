<app-loading [loading]="loading"></app-loading>
<div class="cnv-backdrop">
  <div class="cnv-modal">
    <button class="cnv-close" (click)="doClose()">✕</button>

    <!-- Steps Progress (زي create-new-project) -->
    <div class="progress-container">
      <div *ngFor="let stepItem of steps; let i = index" class="progress-segment"
        [class.active]="i < step"></div>
    </div>

    <div *ngIf="step === 3" class="review-actions">
      <button class="action-icon" (click)="editVisit()" title="Edit">
        <img src="assets/images/edit.png" alt="Edit">
      </button>
      <button class="action-icon" (click)="clearVisit()" title="Reset">
        <img src="assets/images/delete.png" alt="Delete">
      </button>
    </div>

    <!-- STEP 1: Task Info + Units -->
    <div *ngIf="step === 1" class="cnv-step">
      <label>Project <span class="required">*</span>
        <select [(ngModel)]="form.project" name="project" (ngModelChange)="onProjectChange($event)"
          [ngClass]="{'input-error': submitted && !form.project}">
          <option value="" disabled selected>Select Project</option>
          <option value="">Not Project</option>
          <option *ngFor="let p of projects" [value]="p.id">{{p?.name}}</option>
        </select>
      </label>

      <!-- اختيار أكتر من Unit -->
      <label>Select Units
        <span class="field-hint"> you can select more than one </span>
        <div *ngIf="availableUnits.length" class="units-list"
          [ngClass]="{'input-error': submitted && form.project && selectedUnitIds.length === 0}">
          <div *ngFor="let u of availableUnits" class="unit-item"
            [class.selected]="isUnitSelected(u)" (click)="toggleUnit(u)">
            <input type="checkbox" [checked]="isUnitSelected(u)" readonly />
            <span>{{ u.model }} ({{ u.serial }})</span>
          </div>
        </div>
        <div *ngIf="!availableUnits.length && form.project" class="no-units">
          No units available for this project
        </div>
        <div *ngIf="!form.project" class="no-units">
          Select a project to see its units — or keep "Not Project" for a general task
        </div>
      </label>

      <label>Visit Objective
        <input [(ngModel)]="form.objective" name="objective"
          [ngClass]="{'input-error': submitted && !form.project && !form.objective}" />
      </label>

      <!-- Address + Lat/Lg للقراءة فقط بتتعبى من المشروع -->
      <label>Address
        <input type="text" [value]="address" name="address" readonly class="readonly-input"
          placeholder="Auto-filled from project" />
      </label>
      <label>Latitude
        <input type="text" [value]="lat" name="lat" readonly class="readonly-input"
          placeholder="Auto-filled from project" />
      </label>
      <label>Longitude
        <input type="text" [value]="lng" name="lng" readonly class="readonly-input"
          placeholder="Auto-filled from project" />
      </label>
    </div>

    <!-- STEP 2: Due Date & Technician -->
    <div *ngIf="step === 2" class="cnv-step">

      <label>Date <span class="required">*</span>
        <input type="date" [(ngModel)]="form.due" name="due" (click)="forceDatePicker($event)"
          class="styled-date-input" [ngClass]="{'input-error': submitted && !form.due}" />
      </label>
      <label>Time
        <input type="time" [(ngModel)]="form.time" name="time" (click)="forceDatePicker($event)"
          class="styled-time-input" />
      </label>

      <label>Technician
        <select [(ngModel)]="selectedTechnicianId" name="technician_select" (change)="addTechnician()">
          <option value="" disabled selected>Select Technician(s)</option>
          <option *ngFor="let t of technicians" [value]="t.id" [disabled]="isTechSelected(t.id)">{{t.name}}
          </option>
        </select>
        <div class="field-hint" *ngIf="selectedTechnicianId">
          Selected: {{ selectedTechnicianDisplay }}
        </div>
      </label>
      <div class="selected-technicians-container" *ngIf="selectedTechnicians.length > 0">
        <div *ngFor="let t of selectedTechnicians" class="technician-chip">
          <span>{{ t.name || t.id }}</span>
          <button type="button" class="remove-chip-btn" (click)="removeTechnician(t)">✕</button>
        </div>
      </div>
    </div>

    <!-- STEP 3 (Review) -->
    <div *ngIf="step === 3" class="cnv-step review-view">
      <h3>Review Task</h3>
      <div class="review-row"><strong>Project:</strong> {{form.project}}</div>
      <div class="review-row"><strong>Units:</strong> {{ getSelectedUnitsLabel() || 'General Visit' }}</div>
      <div class="review-row"><strong>Address:</strong> {{address}}</div>
      <div class="review-row"><strong>Due:</strong> {{form.due}}</div>
      <div class="review-row"><strong>Time:</strong> {{form.time}}</div>
      <div class="review-row"><strong>Objective:</strong> {{form.objective}}</div>
      <div class="review-row"><strong>Priority:</strong> {{form.priority}}</div>
      <div class="review-row"><strong>Technicians:</strong> {{ getTechniciansLabel() }}</div>
    </div>

    <!-- Navigation Actions (زي create-new-project) -->
    <div class="cnv-actions report-actions">
      <button type="button" class="cancel-button" (click)="doClose()">Cancel</button>
      <div class="right-actions">
        <button type="button" *ngIf="step > 1" class="back-button" (click)="goBack()">Back</button>
        <button type="button" class="save-button-large yellow-bg next-button" (click)="goNext()" [disabled]="saving">
          <span class="button-loader" *ngIf="saving"></span>
          {{ saving ? 'Creating...' : (step === 3 ? 'Create Task' : 'Next') }}
        </button>
      </div>
    </div>
  </div>
</div>
